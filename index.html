<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat Sederhana</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-container">
    <h2>WebSocket Chat Sederhana</h2>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Tulis pesan..." />
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    const socket = new WebSocket('ws://localhost:8080');
    const chatBox = document.getElementById('chatBox');
    const input = document.getElementById('messageInput');

    socket.onopen = function () {
      chatBox.innerHTML += "<p class='system-message'>Terhubung ke server WebSocket.</p>";
    };

    socket.onmessage = function (event) {
      if (event.data instanceof Blob) {
        const reader = new FileReader();
        reader.onload = function () {
          chatBox.innerHTML += `<p class='message'>${reader.result}</p>`;
          chatBox.scrollTop = chatBox.scrollHeight;
        };
        reader.readAsText(event.data);
      } else {
        chatBox.innerHTML += `<p class='message'>${event.data}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    };

    socket.onclose = function () {
      chatBox.innerHTML += "<p class='system-message'>Terputus dari server.</p>";
    };

    function sendMessage() {
      const message = input.value;
      if (message.trim() !== '') {
        socket.send(message);
        chatBox.innerHTML += `<p class='my-message'>${message}</p>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // Memungkinkan pengguna mengirim pesan dengan Enter
    input.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
